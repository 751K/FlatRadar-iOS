# iOS 单元测试。
#
# 为什么单独一个 workflow 而不是并进 build.yml
# --------------------------------------------
# build.yml 只在打 tag 和手动触发时跑，产出的是 .dmg / .exe / .apk 安装包。
# 测试要在**每次推送**都跑，两者的触发条件天然不同。
#
# 为什么必须放云端
# ----------------
# 本地开发机装了 Xcode，但没有 iOS platform 的模拟器 runtime（Xcode >
# Settings > Components 里另外下载，几个 GB），于是 `xcodebuild` 连
# destination 都找不到：
#
#     error: iOS 26.5 is not installed.
#
# 结果是 Swift 改动只能靠 `swiftc -typecheck` 验类型，**跑不了一条测试**。
# GitHub 的 macOS runner 自带 Xcode + 若干 iOS 模拟器，正好补上这一环。
name: iOS Tests

# 这里**没有** paths 过滤器，是有意的。
#
# 拆仓之前它写的是 paths: ['ios/**']——单仓库里那是合理的，后端改动不必去跑
# 模拟器。搬到这个仓库之后同一行会变成一个静默的开关：仓库里根本没有 ios/
# 目录，过滤器一条都匹配不上，工作流从此再也不触发，而 Actions 页面上只会
# 显示一片空白，不会有任何一行说「因为路径不匹配所以跳过了」。
#
# 这个仓库里的每一次推送都是 iOS 改动，过滤器本来也没有存在的理由。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支上连续推送时，旧的跑一半就取消——模拟器测试很慢，排队没有意义。
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 先把环境打印出来。runner 镜像里的 Xcode 版本会随 GitHub 更新漂移，
      # 哪天挂了，第一眼要能看出是不是换了 Xcode / 模拟器列表变了。
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # tests/ 下那几个 pytest 是对**仓库文件**的检查（pbxproj 的版本号与语言
      # 模式、AppIcon 的深色图标、截图上传前的体检、CI 配置本身），不需要模拟器。
      # 它们此前一次都没在 CI 里跑过——40 多条测试只在本地手跑时才有意义，而
      # 「没人跑的测试」和「没有测试」是一回事。放在模拟器那一步之前，秒级失败。
      #
      # 必须建 venv：runner 上是 Homebrew 的 python3，自带 pytest 的概率为零
      # （第一次加这步就撞上 "No module named pytest"），而直接 pip install
      # 会被 PEP 668 的 externally-managed-environment 挡回来。
      #
      # pytest 在一条用例都没收集到时退出码是 5，同样会让这步失败——和下面
      # 那条 "Assert tests actually ran" 是同一个判据：绿色必须有产出背书。
      - name: Run repo checks (pytest)
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --quiet --disable-pip-version-check -r requirements-dev.txt
          .ci-venv/bin/pytest tests -q

      # 不写死 "iPhone 16" 之类的名字：GitHub 换镜像时那个型号可能就没了，
      # 而报错是 "no destinations"，看上去像项目坏了。挑选逻辑在
      # scripts/pick_simulator.py，那边有单元测试。
      - name: Pick a simulator
        id: sim
        run: |
          PICKED=$(xcrun simctl list devices available --json \
            | python3 scripts/pick_simulator.py)
          echo "选中：$(echo "$PICKED" | cut -f2-3)"
          echo "udid=$(echo "$PICKED" | cut -f1)" >> "$GITHUB_OUTPUT"

      # 只跑单元测试。FlatRadarUITests 里是 App Store 截图自动化——每条用例
      # 都要重启 App、走完整页面，慢且与正确性无关，不该挡住合并。
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FlatRadar.xcodeproj \
            -scheme FlatRadar \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:FlatRadarTests \
            -resultBundlePath ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | { command -v xcpretty >/dev/null && xcpretty || cat; }
          # xcpretty 不一定在镜像里；没有就原样打印。退出码必须取 xcodebuild
          # 那一段，否则格式化工具成功就把测试失败吞掉了。

      # xcodebuild 在**一条用例都没执行**时同样打印 "Test Succeeded"、同样
      # 退出 0。第一次跑这条流水线就撞上了：日志里从头到尾没有一个用例名，
      # 而 CI 是绿的——「全过了」和「压根没跑」分不开。
      #
      # 绿色必须由执行条数背书，不能由退出码背书。
      - name: Assert tests actually ran
        if: always()
        run: python3 scripts/summarize_xcresult.py ios-tests.xcresult

      # 无论成败都传：成功时用来核对条数，失败时用来看是哪条断言、什么值——
      # xcodebuild 的终端输出经常只说一句 "Test Suite failed"。
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios-tests.xcresult
          retention-days: 7
