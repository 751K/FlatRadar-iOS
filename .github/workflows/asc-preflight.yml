# App Store Connect 凭据体检。
#
# 为什么单独有这么一条
# --------------------
# release.yml 是唯一用到 ASC_* 三个 secret 的工作流，而它只在真要发版时才按。
# 于是「凭据配错了」这件事的暴露时机是最糟的那个：你想发版的那一刻。
#
# 而且最常见的两种配错，光看 `gh secret list` 一点都看不出来——名字在那儿，
# 三个都齐：
#
#   1. ASC_KEY_ID 尾部多一个换行。release.yml 会拼 AuthKey_${ASC_KEY_ID}.p8
#      当文件名，多一个 \n 文件名就废了，而报错是「私钥文件不存在」，
#      根因藏在两层之外。
#   2. ASC_KEY_P8 粘贴时被截断或丢了换行。ES256 私钥解析失败，报错是一句
#      密码学库的堆栈，跟「secret 配错了」看不出关系。
#
# 这条工作流只读：签一个 JWT，查一次 app 信息，什么都不改、不上传、不提交。
# 配好 secret 之后按一次，几十秒，比在发版当天调试强。
name: Secrets Preflight

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install 'pyjwt[crypto]>=2.8.0'

      - name: 体检
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.j.kong.FlatRadar
        run: |
          set -euo pipefail

          # 先查那两个「看不出来」的配错，再去调 API——否则 API 报的错会把
          # 根因盖掉。
          python3 - <<'PY'
          import os, re, sys

          fails = []

          kid = os.environ.get("ASC_KEY_ID", "")
          if not kid:
              fails.append("ASC_KEY_ID 是空的")
          elif kid != kid.strip():
              fails.append(
                  "ASC_KEY_ID 首尾有空白字符（多半是粘贴时带了换行）。"
                  "release.yml 会拿它拼 AuthKey_<ID>.p8 的文件名，"
                  "带空白就会变成「私钥文件不存在」。")
          elif not re.fullmatch(r"[A-Z0-9]{10}", kid):
              fails.append(f"ASC_KEY_ID 不像 ASC 的 key id（应是 10 位大写字母数字），长度 {len(kid)}")

          iss = os.environ.get("ASC_ISSUER_ID", "")
          if not iss:
              fails.append("ASC_ISSUER_ID 是空的")
          elif iss != iss.strip():
              fails.append("ASC_ISSUER_ID 首尾有空白字符")
          elif not re.fullmatch(r"[0-9a-fA-F-]{36}", iss):
              fails.append(f"ASC_ISSUER_ID 不像 UUID，长度 {len(iss)}")

          p8 = os.environ.get("ASC_KEY_P8", "")
          if not p8:
              fails.append("ASC_KEY_P8 是空的")
          else:
              if "BEGIN PRIVATE KEY" not in p8:
                  fails.append("ASC_KEY_P8 里没有 BEGIN PRIVATE KEY —— 内容不是 .p8 私钥")
              if "END PRIVATE KEY" not in p8:
                  fails.append("ASC_KEY_P8 里没有 END PRIVATE KEY —— 多半被截断了")
              if p8.count("\n") < 2:
                  fails.append("ASC_KEY_P8 只有一行 —— 换行在粘贴时丢了")

          if fails:
              # 只说形状，不打印任何值。
              print("凭据形状检查未通过：")
              for f in fails:
                  print("  ✗ " + f)
              sys.exit(1)
          print("✓ 形状检查通过（key id 10 位、issuer 是 UUID、私钥有头有尾有换行）")
          PY

          # 私钥落盘，权限收紧
          install -m 700 -d "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

          python3 -c "
          import json, os, pathlib
          tmp = os.environ['RUNNER_TEMP']
          cfg = {
              'key_id': os.environ['ASC_KEY_ID'],
              'issuer_id': os.environ['ASC_ISSUER_ID'],
              'p8_path': f\"{tmp}/asc/AuthKey_{os.environ['ASC_KEY_ID']}.p8\",
              'bundle_id': os.environ['BUNDLE_ID'],
          }
          pathlib.Path(f'{tmp}/asc/config.json').write_text(json.dumps(cfg))
          "

          # 真正调一次 API：签 JWT + 按 bundle id 查 app。只读。
          ASC_CONFIG="$RUNNER_TEMP/asc/config.json" python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools/asc")
          import asc_api as m

          cfg = m.load_config()
          m.jwt_for(cfg)          # 私钥不能签名的话，这里就炸
          app = m.find_app(cfg)   # issuer / key 无权限的话，这里 401
          a = app["attributes"]
          print(f"✓ 凭据可用：{a.get('name')}  ({a.get('bundleId')})  id={app['id']}")
          PY

  ui-test-credentials:
    # 截图用的那对凭据，失效方式比 ASC 那三个更阴。
    #
    # 值为空时 ScreenshotTests.launch() 和 ci_post_clone.sh 都会**静默退回访客
    # 模式**——测试全过、张数尺寸全对，只是 Notifications 那一屏拍不到（访客的
    # tab bar 里没有 Alerts）。2026-09-04 那批产出就是这么少了一屏，而没有任何
    # 一行日志说过一句。
    #
    # 所以这里真的登录一次。登完立刻登出，不给用户的「活跃会话」留下垃圾。
    runs-on: ubuntu-latest
    steps:
      - name: 登录一次再登出
        env:
          UI_TEST_USERNAME: ${{ secrets.UI_TEST_USERNAME }}
          UI_TEST_PASSWORD: ${{ secrets.UI_TEST_PASSWORD }}
          API: https://flatradar.app/api/v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          api = os.environ["API"]
          user = os.environ.get("UI_TEST_USERNAME", "")
          pw = os.environ.get("UI_TEST_PASSWORD", "")

          if not user or not pw:
              sys.exit("✗ UI_TEST_USERNAME / UI_TEST_PASSWORD 有一个是空的。"
                       "截图会静默退回访客模式，Notifications 那屏拍不到，"
                       "而测试仍然全过。")

          # UA 是必须的，不是礼貌。带 urllib 默认 UA 时 Cloudflare 直接回
          # 403 + "error code: 1010"，请求根本到不了后端——而 403 看起来
          # 太像「凭据被拒」了，这条检查会替 Cloudflare 背锅，报一句
          # 「用户名或密码不对」，然后你去改一个本来就没错的 secret。
          HEADERS = {"Content-Type": "application/json",
                     "User-Agent": "FlatRadar-CI/1.0 (secrets-preflight)"}

          def post(path, body, token=None):
              h = dict(HEADERS)
              if token:
                  h["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(
                  api + path, data=json.dumps(body).encode(),
                  headers=h, method="POST")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          def envelope(raw):
              """后端的响应一定是 {ok, data|error}。解不出这个壳，说明这次
              回应不是后端给的（Cloudflare 拦截页、网关错误页……）。"""
              try:
                  d = json.loads(raw)
              except Exception:
                  return None
              return d if isinstance(d, dict) and "ok" in d else None

          try:
              resp = post("/auth/login",
                          {"username": user, "password": pw,
                           "device_name": "secrets-preflight", "ttl_days": 1})
          except urllib.error.HTTPError as e:
              raw = e.read()
              env = envelope(raw)
              if env is None:
                  sys.exit(f"✗ 请求没到后端：HTTP {e.code}，"
                           f"server={e.headers.get('server')}，"
                           f"body={raw[:120]!r}。"
                           "这不是凭据问题，别去动 secret。")
              msg = (env.get("error") or {}).get("message", "")
              sys.exit(f"✗ 登录被拒：HTTP {e.code} {msg}——"
                       "secret 里的用户名或密码不对。")
          except urllib.error.URLError as e:
              sys.exit(f"✗ 连不上 {api}：{e.reason}。这不是凭据问题。")

          data = resp.get("data") or {}
          token = data.get("token")
          if not token:
              sys.exit(f"✗ 登录返回里没有 token，字段是 {sorted(data)}")

          role = data.get("role") or (data.get("user") or {}).get("role")
          print(f"✓ 凭据可用：{user} 登录成功，role={role}")
          if role == "guest":
              sys.exit("✗ 这个账号是 guest —— 访客的 tab bar 里没有 Alerts，"
                       "Notifications 那屏还是拍不到。")

          # 不留会话：/auth/verify 要求先有 token，验不了「密码对不对」这件事
          # 本身，所以只能真登录；那就负责把它撤掉。
          try:
              post("/auth/logout", {}, token=token)
              print("✓ 已登出，未留下会话")
          except urllib.error.HTTPError as e:
              print(f"⚠ 登出失败 HTTP {e.code}——会话会自然过期（ttl_days=1）")
          PY
